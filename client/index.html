<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta
      name="description"
      content="Official platform of Rangpur Divisional Student Welfare Association, University of Barishal. Member directory, events, notices, committees, and more."
    />
    <meta
      name="theme-color"
      content="#008f57"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#042f1f"
      media="(prefers-color-scheme: dark)"
    />
    <!-- Declares support for both colour schemes, without which Android WebView and some embedded iOS browsers force light mode and make `prefers-color-scheme` queries lie. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="RDSWA - Rangpur Divisional Student Welfare Association"
    />
    <meta
      property="og:description"
      content="Official platform of Rangpur Divisional Student Welfare Association, University of Barishal."
    />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    <meta property="og:site_name" content="RDSWA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="RDSWA - Rangpur Divisional Student Welfare Association"
    />
    <meta
      name="twitter:description"
      content="Official platform of Rangpur Divisional Student Welfare Association, University of Barishal."
    />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- AdSense ownership verification, kept as a static tag rather than JS-injected because the site-review crawler reads the raw HTML response without reliably executing JS. -->
    <meta name="google-adsense-account" content="ca-pub-1036044341182474" />

    <!-- Search Console ownership verification, static for the same reason as AdSense: its crawler reads the raw HTML and never runs react-helmet. -->
    <meta
      name="google-site-verification"
      content="fuobzYJ0CaxpVnoQthO1nUT2_EfKd445J8pPB3035lU"
    />
    <meta
      name="google-site-verification"
      content="_Operpd8gUpAS9nLvt371mm6_aD1MGeoLXvNlm2ifHI"
    />

    <!-- AdSense script loader, env-gated on VITE_ADSENSE_CLIENT so local dev makes no request while the verification meta above stays active in every environment. -->
    <script>
      (function () {
        var c = "%VITE_ADSENSE_CLIENT%";
        if (!c || c.indexOf("ca-pub-") !== 0) return;
        var s = document.createElement("script");
        s.async = true;
        s.crossOrigin = "anonymous";
        s.src =
          "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" +
          c;
        document.head.appendChild(s);
      })();
    </script>

    <!-- Microsoft Clarity loader, env-gated on VITE_CLARITY_PROJECT_ID so dev sessions stay out of analytics, using the stock bootstrap shim that queues early calls and follows SPA route changes on its own. -->
    <script>
      (function () {
        var id = "%VITE_CLARITY_PROJECT_ID%";
        // Skip an unsubstituted placeholder or an implausibly short id, with a loose bound so a format change at Microsoft cannot break the gate.
        if (!id || id.length < 6 || id.indexOf("VITE_") === 0) return;
        (function (c, l, a, r, i, t, y) {
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r); t.async = 1; t.src = "https://www.clarity.ms/tag/" + i;
          y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, "clarity", "script", id);
      })();
    </script>
    <title>RDSWA - Rangpur Divisional Student Welfare Association</title>
    <!-- Resolves the theme before React hydrates so the first paint is already correct, mirroring src/stores/themeStore.ts in the order localStorage → system → light. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var isDark =
            saved === "dark" ||
            ((saved === "system" || saved == null) &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (isDark) root.classList.add("dark");
          root.dataset.theme = isDark ? "dark" : "light";
        } catch (e) {
          /* localStorage blocked: fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
